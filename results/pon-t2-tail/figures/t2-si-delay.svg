<title id="title">T2 FIFO delay by GIANT service interval and REPORT polling</title><desc id="desc">3050 Mb/s offered load · 100 ms observation cutoff · 3 matched seeds · ABmin in bytes per SFU. Dots show the mean of the seed statistics. Whiskers span the seed min–max. The dashed line marks RR. Wait runs from enqueue to load. Waits still in the FIFO at the cutoff are censored. Rings mark limited tail support.</desc>
