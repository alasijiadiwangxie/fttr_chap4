# SFU 3 无业务并沿用 LEGACY。SFU 1 的 LCM 发送下行，SFU 2 的 HCM 接收上行，两者独立记账。
traffic.mode=manual
traffic.direction=BOTH
sfu.count=3
sta.count=2
sta.1.sfu.id=1
sta.2.sfu.id=2
packet.arrival.us=0,0
packet.bytes=1200
packet.1.type=VO
packet.1.direction=DL
packet.1.sta.id=1
packet.2.type=VO
packet.2.direction=UL
packet.2.sta.id=2
fiber.delay.us=0

sfu.1.wifi.ap.mode=LCM
sfu.2.wifi.ap.mode=HCM
wifi.model=he-su
wifi.phy.mcs=7
wifi.phy.gi.us=0.8
wifi.phy.mac.overhead.bytes=34
wifi.phy.he-ltf.type=2
wifi.phy.nominal.packet.padding.us=0

# 两个独立信道均在 34 μs 完成 VO AIFS 并启动 DATA。
wifi.mac.access=edca-multi-ac
wifi.mac.edca.seed=0
wifi.mac.edca.VO.cwmin=0
wifi.mac.exchange=data-sifs-ack
wifi.mac.sifs.us=16
wifi.mac.ack.rate.mbps=24

wifi.ap.activity.enabled=true
wifi.ap.activity.window.us=1000

# 使用 B3 初始研究功耗配置。
wifi.ap.energy.enabled=true
