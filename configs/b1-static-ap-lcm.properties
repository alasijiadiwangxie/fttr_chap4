# B1 静态 AP 能力对照。两条 1200 B 下行报文同时进入 MFU。
traffic.mode=manual
traffic.direction=DL
sfu.count=1
sta.count=1
sta.1.sfu.id=1
packet.arrival.us=0,0
packet.bytes=1200
packet.1.type=VO
packet.2.type=VO
packet.1.sta.id=1
packet.2.sta.id=1
fiber.delay.us=0

# AP 采用 LCM（20 MHz、1 NSS），STA 上限保持 80 MHz、2 NSS。
sfu.1.wifi.ap.mode=LCM
sta.1.wifi.max.bandwidth.mhz=80
sta.1.wifi.max.nss=2
wifi.model=he-su
wifi.phy.mcs=7
wifi.phy.gi.us=0.8
wifi.phy.mac.overhead.bytes=34
wifi.phy.he-ltf.type=2
wifi.phy.nominal.packet.padding.us=0

# 两种静态模式复用相同的 EDCA 参数与种子，逐次比较 DATA 和完整交换时长。
wifi.mac.access=edca-multi-ac
wifi.mac.edca.seed=0
wifi.mac.exchange=data-sifs-ack
wifi.mac.sifs.us=16
wifi.mac.ack.rate.mbps=24
