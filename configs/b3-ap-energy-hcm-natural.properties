# B2 的 B1 对照用例，同批两条 1200 B VO 下行报文。
traffic.mode=manual
traffic.direction=DL
sfu.count=1
sta.count=1
sta.1.sfu.id=1
packet.arrival.us=0,0
packet.bytes=1200
packet.1.type=VO
packet.2.type=VO
packet.1.sta.id=1
packet.2.sta.id=1
fiber.delay.us=0

sfu.1.wifi.ap.mode=HCM
sta.1.wifi.max.bandwidth.mhz=80
sta.1.wifi.max.nss=2
wifi.model=he-su
wifi.phy.mcs=7
wifi.phy.gi.us=0.8
wifi.phy.mac.overhead.bytes=34
wifi.phy.he-ltf.type=2
wifi.phy.nominal.packet.padding.us=0

wifi.mac.access=edca-multi-ac
wifi.mac.edca.seed=0
wifi.mac.exchange=data-sifs-ack
wifi.mac.sifs.us=16
wifi.mac.ack.rate.mbps=24

wifi.ap.activity.enabled=true
# AP 活动窗口随仿真自然结束。

# 使用 B3 初始研究功耗配置。
wifi.ap.energy.enabled=true
