# HCM 请求发生于首包 DATA 中。第二包在切换过程中到达，第三包在切回 LCM 后到达。
traffic.mode=manual
traffic.direction=DL
packet.arrival.us=0,260,640
packet.bytes=1200
packet.1.type=VO
packet.2.type=VO
packet.3.type=VO
fiber.delay.us=0

sfu.1.wifi.ap.mode=LCM
wifi.mac.access=edca-multi-ac
wifi.mac.edca.VO.cwmin=0
wifi.mac.edca.seed=0
wifi.mac.exchange=data-sifs-ack
wifi.mac.sifs.us=16
wifi.mac.ack.rate.mbps=24

wifi.ap.activity.enabled=true
wifi.ap.energy.enabled=true
wifi.ap.switch.enabled=true
sfu.1.wifi.ap.switch.requests=100:HCM,600:LCM

# 验收输入，两个方向的时延和功率均用于独立核算。
wifi.ap.switch.lcm-to-hcm.delay.us=40.125
wifi.ap.switch.lcm-to-hcm.power.w=11.50
wifi.ap.switch.hcm-to-lcm.delay.us=25.250
wifi.ap.switch.hcm-to-lcm.power.w=8.75
