# 两台 SFU 各关联两台 STA。报文从 STA 经过关联 SFU 上行至 MFU。
traffic.mode=poisson
traffic.direction=UL
traffic.duration.us=1000000
sfu.count=2
sta.count=4
sta.1.sfu.id=1
sta.2.sfu.id=1
sta.3.sfu.id=2
sta.4.sfu.id=2
fiber.delay.us=100
wifi.delay.us=250

# 对于 1500 B 报文，20 Mb/s 约合 1666.67 包/s。
# VO、VI、BE、BK 的权重 5:10:3:2 对应每台 STA 的目标负载 5、10、3、2 Mb/s。
traffic.sta.1.rate.pps=1666.6666666666667
traffic.sta.1.packet.bytes=1500
traffic.sta.1.class.weights=5,10,3,2
traffic.sta.1.seed=283

traffic.sta.2.rate.pps=1666.6666666666667
traffic.sta.2.packet.bytes=1500
traffic.sta.2.class.weights=5,10,3,2
traffic.sta.2.seed=-312

traffic.sta.3.rate.pps=1666.6666666666667
traffic.sta.3.packet.bytes=1500
traffic.sta.3.class.weights=5,10,3,2
traffic.sta.3.seed=103

traffic.sta.4.rate.pps=1666.6666666666667
traffic.sta.4.packet.bytes=1500
traffic.sta.4.class.weights=5,10,3,2
traffic.sta.4.seed=104
