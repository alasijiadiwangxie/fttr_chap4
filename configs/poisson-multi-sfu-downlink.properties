# 共享最长生成窗口为 1 s，SFU 1 提前在 0.8 s 停止生成。
traffic.mode=poisson
traffic.duration.us=1000000
sfu.count=3
sta.count=4
sta.1.sfu.id=1
sta.2.sfu.id=1
sta.3.sfu.id=2
sta.4.sfu.id=2
fiber.delay.us=100
wifi.delay.us=250

# 两台 SFU 独立生成。权重顺序为 VO、VI、BE、BK。
traffic.sfu.1.rate.pps=80
traffic.sfu.1.packet.bytes=1200
traffic.sfu.1.seed=283
traffic.sfu.1.duration.us=800000
traffic.sfu.1.class.weights=1,2,6,1

traffic.sfu.2.rate.pps=150
traffic.sfu.2.packet.bytes=900
traffic.sfu.2.seed=-312
traffic.sfu.2.class.weights=2,3,4,1

# SFU 3 无关联终端，省略速率即不生成报文，仍会输出零统计。
