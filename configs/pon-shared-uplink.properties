# 两个上行报文在 0 μs 生成，先进入关联 SFU 2 的 STA，再进入关联 SFU 1 的 STA。
traffic.direction=BOTH
sfu.count=2
sta.count=2
sta.1.sfu.id=1
sta.2.sfu.id=2
packet.arrival.us=0,0,99
packet.bytes=1200
packet.1.direction=UL
packet.1.sta.id=2
packet.1.type=VO
packet.2.direction=UL
packet.2.sta.id=1
packet.2.type=VO
packet.3.direction=DL
packet.3.sta.id=1
packet.3.type=VO

# 上行串行化时间为 3.84 μs。下行报文独立发送，占用 99–99.96 μs。
fiber.uplink.mode=pon-shared
fiber.uplink.rate.mbps=2500
fiber.uplink.propagation.us=10
fiber.downlink.mode=pon-shared
fiber.downlink.rate.mbps=10000
fiber.downlink.propagation.us=10

# 零退避使两个上行 DATA 都在 34 μs 开始、98 μs 完成，便于核对光侧同刻请求。
wifi.model=he-su
wifi.mac.exchange=data-sifs-ack
wifi.mac.access=edca-multi-ac
wifi.mac.edca.VO.cwmin=0
wifi.mac.edca.VO.cwmax=0
