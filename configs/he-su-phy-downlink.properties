# 两包同时进入 MFU。静态 PHY 下，不同包长可能跨越不同数量的 HE OFDM 符号。
packet.arrival.us=0,0
packet.bytes=1500
packet.2.bytes=5000
fiber.delay.us=100

# 未指定 PHY 参数时，使用 160 MHz、MCS 11、2 NSS、0.8 μs GI。
wifi.model=he-su
# wifi.phy.bandwidth.mhz=20
# wifi.phy.mcs=0
# wifi.phy.nss=1
# wifi.phy.gi.us=0.8
# wifi.phy.he-ltf.type=2
# wifi.phy.nominal.packet.padding.us=0

# 资源占用持续到 ACK 完成。省略交换模式或设为 data-only 可复现仅 DATA 的时序。
wifi.mac.exchange=data-sifs-ack
# SIFS 供 ACK 和 AIFS 计算共用。
# wifi.mac.sifs.us=16
# wifi.mac.ack.rate.mbps=24

