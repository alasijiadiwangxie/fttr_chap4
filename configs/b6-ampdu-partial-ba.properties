# 同一 AC 的四个报文同时入队。确定性测试注入只影响 ID 2 和 4 的首次聚合发送。
traffic.mode=manual
traffic.direction=DL
packet.arrival.us=0,0,0,0
packet.bytes=1500
sfu.count=1
sta.count=1
fiber.delay.us=0
sfu.1.wifi.ap.mode=HCM
wifi.model=he-su
wifi.mac.access=edca-multi-ac
wifi.mac.exchange=data-sifs-ack
wifi.mac.ack.rate.mbps=24
wifi.mac.edca.BE.aifsn=3
wifi.mac.edca.BE.cwmin=0
wifi.mac.edca.BE.txop.limit.us=0
wifi.mac.ampdu.enabled=true
wifi.mac.ampdu.max-mpdus=4
wifi.mac.ampdu.max-bytes=65535
wifi.mac.ampdu.first-attempt-error.packet.ids=2,4
wifi.ap.activity.enabled=true
wifi.ap.activity.window.us=1000
wifi.ap.energy.enabled=true
