# 两台 STA 关联到同一台 SFU，分别配置上行泊松业务。
traffic.mode=poisson
traffic.direction=UL
traffic.duration.us=1000000
sfu.count=1
sta.count=2
sta.1.sfu.id=1
sta.2.sfu.id=1
fiber.delay.us=100
wifi.delay.us=40

# STA 1 的四类业务各用一条泊松流，每类的负载和包长单独指定。
traffic.sta.1.seed=283
traffic.sta.1.class.VO.rate.mbps=5
traffic.sta.1.class.VO.packet.bytes=200
traffic.sta.1.class.VI.rate.mbps=10
traffic.sta.1.class.VI.packet.bytes=1000
traffic.sta.1.class.BE.rate.mbps=3
traffic.sta.1.class.BE.packet.bytes=1500
traffic.sta.1.class.BK.rate.mbps=2
traffic.sta.1.class.BK.packet.bytes=750

# STA 2 只启用 VO，其他类别省略。
traffic.sta.2.seed=312
traffic.sta.2.class.VO.rate.mbps=10
traffic.sta.2.class.VO.packet.bytes=200
