# SFU 1 在 0 μs 切为 HCM 并随后下行。SFU 2 在上行交换结束后独立切为 LCM。
traffic.mode=manual
traffic.direction=BOTH
sfu.count=2
sta.count=2
sta.1.sfu.id=1
sta.2.sfu.id=2
packet.arrival.us=0,0,210
packet.bytes=1200
packet.1.type=VO
packet.2.type=VO
packet.3.type=VO
packet.1.direction=DL
packet.2.direction=UL
packet.3.direction=UL
packet.1.sta.id=1
packet.2.sta.id=2
packet.3.sta.id=2
fiber.delay.us=0

sfu.1.wifi.ap.mode=LCM
sfu.2.wifi.ap.mode=HCM
wifi.mac.access=edca-multi-ac
wifi.mac.edca.VO.cwmin=0
wifi.mac.edca.seed=0
wifi.mac.exchange=data-sifs-ack
wifi.mac.sifs.us=16
wifi.mac.ack.rate.mbps=24

wifi.ap.activity.enabled=true
wifi.ap.activity.window.us=800
wifi.ap.energy.enabled=true
wifi.ap.switch.enabled=true
sfu.1.wifi.ap.switch.requests=0:HCM
sfu.2.wifi.ap.switch.requests=50:LCM

wifi.ap.switch.lcm-to-hcm.delay.us=40.125
wifi.ap.switch.lcm-to-hcm.power.w=11.50
wifi.ap.switch.hcm-to-lcm.delay.us=25.250
wifi.ap.switch.hcm-to-lcm.power.w=8.75
