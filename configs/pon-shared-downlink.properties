# 两个 1200 B 报文同刻进入 MFU，先发往 SFU 2，再发往 SFU 1。
# 即使第二包的无线业务优先级更高，光侧仍按报文入队顺序发送。
sfu.count=2
sta.count=2
sta.1.sfu.id=1
sta.2.sfu.id=2
packet.arrival.us=0,0
packet.bytes=1200
packet.1.sta.id=2
packet.1.type=BE
packet.2.sta.id=1
packet.2.type=VO

# 单个共享发送器。两包发送开始时间为 0 和 0.96 μs。
fiber.downlink.mode=pon-shared
fiber.downlink.rate.mbps=10000
fiber.downlink.propagation.us=10

# 两台 SFU 收到光报文后各自启动原有 EDCA 竞争。
wifi.model=he-su
wifi.mac.exchange=data-sifs-ack
wifi.mac.access=edca-multi-ac
